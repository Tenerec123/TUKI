<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T.U.K.I. WAKE WORD</title>
  <link rel="icon" type="image/svg" href="TUKI.svg">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/frontend/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script type="importmap">
  {
    "imports": {
      "onnxruntime-web": "/frontend/vendor/onnxruntime-web/ort.min.js",
      "openwakeword-web": "/frontend/vendor/openwakeword-web/openwakeword.js",
      "openwakeword-web/microphone": "/frontend/vendor/openwakeword-web/microphone.js"
    }
  }
  </script>
  <style>
    /* Card layout for the wake word dashboard (matches TUKI dark theme). */
    .wake-card {
      max-width: 720px;
      margin: 40px auto;
      padding: 24px;
      background: #181a1f;
      border: 1px solid #282c34;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    #status {
      font-size: 1.4rem;
      color: var(--neon-yellow);
      text-shadow: var(--glow-yellow-on);
      min-height: 2rem;
      text-align: center;
    }
    #status.error {
      color: var(--neon-red);
      text-shadow: var(--glow-red-on);
    }
    #toggle-btn {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 2px solid var(--neon-yellow);
      background: var(--dark-bg);
      color: var(--neon-yellow);
      font-size: 2.6rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: box-shadow 0.2s, background 0.2s;
    }
    #toggle-btn:hover {
      box-shadow: var(--glow-yellow-on);
    }
    #toggle-btn.listening {
      background: var(--neon-yellow);
      color: var(--dark-bg);
      box-shadow: var(--glow-yellow-on);
    }
    #toggle-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }
    #score {
      font-size: 1.1rem;
      color: var(--off-yellow);
      min-height: 1.4rem;
    }
    #log {
      width: 100%;
      max-height: 220px;
      overflow-y: auto;
      background: #101114;
      border: 1px solid #282c34;
      border-radius: 6px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.8rem;
      color: #abb2bf;
      white-space: pre-wrap;
      word-break: break-word;
      text-align: left;
    }
    #log .detection { color: var(--neon-yellow); }
    #log .error     { color: var(--neon-red); }
    #log .info      { color: #61afef; }
  </style>
</head>
<body>

<header>
  <h1 id="title">T.U.K.I. WAKE WORD</h1>
  <h2 id="subtitle">T_ENEREC's U_NIFIED K_NOWLEDGE I_NTEGRATOR</h2>
  <div id="navbar">
      <a href="chat">CHAT</a>
      <a href="todo">TODO</a>
      <a href="kale">KALE</a>
      <a href="notes">NOTE</a>
      <a class="unable" href="wake">WAKE</a>
  </div>
</header>

<main>
  <div class="wake-card">
    <div id="status">IDLE</div>

    <button id="toggle-btn" title="Start / stop the wake word engine">
      <i class="bi bi-mic"></i>
    </button>

    <div id="score">score: --</div>

    <div id="log"></div>
  </div>
</main>

<script type="module" src="/frontend/wake_script.js"></script>
</body>
</html>
