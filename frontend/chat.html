<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T.U.K.I. CHAT</title>
  <link rel="icon" type="image/svg" href="TUKI.svg">
  <link rel="stylesheet" href="/frontend/style.css">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body);"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>
<body>

<header>
  <h1 id="title">T.U.K.I. CHAT</h1>
  <h2 id="subtitle">T_ENEREC's U_NIFIED K_NOWLEDGE I_NTEGRATOR</h2>
  <div id="navbar">
      <a class="unable" href="chat">CHAT</a>
      <a href="todo">TODO</a>
      <a href="kale">KALE</a>
      <a href="notes">NOTE</a>
  </div>
</header>

<main id="chat-sidebar-container">
  <nav id="sidebar">
    <div class="sidebar-controls">
      <button id="toggle-sidebar">☰</button><br>
      <button id="create-chat" onclick="createConversation()">+</button>
    </div>
    <ul id="conversation-list">
    </ul>
      
  </nav>
  <div id="chat-container">
  </div>
  
<div id="form-container">
  <form id="prompt-form" method="post">
    <textarea id="prompt-writer" name="text" placeholder="Ask something to TUKI" rows="1"></textarea>
    
    <div class="form-controls">
      <details class="model-selector-details">
        <summary class="model-dropdown-btn" title="Seleccionar Modelo">
          <i class="bi bi-chevron-up"></i>
        </summary>
        <div class="model-dropdown-menu">
          <textarea id="model-searcher" name="text" cols="32" rows="1"></textarea>
          <details class="sub-details">
            <summary>
              <span>Orchestrator: </span>
              <span class="model-current-name" id="orchestrator-name"></span>
            </summary>
            <ul>
            </ul>
          </details>
          <details class="sub-details">
            <summary>
              <span>Searcher: </span>
              <span class="model-current-name" id="searcher-name"></span>
            </summary>
            <ul>
            </ul>
          </details>
        </div>
      </details>

      <button type="button" id="toggle-mic" class="btn-tuki">
        <i class="bi bi-mic"></i>
      </button>
      <button type="submit" id="submit-btn" class="btn-tuki">
        <i class="bi bi-arrow-up"></i>
      </button>
    </div>
  </form>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
<script src="/frontend/chat_script.js"></script>
</body>
</html>
